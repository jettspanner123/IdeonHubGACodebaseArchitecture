spring:
  application:
    name: ideonhub-ga-service

  datasource:
    url: ${IDEONHUB_GA_DATABASE_URL:jdbc:postgresql://localhost:5432/ideonhub_ga}
    username: ${IDEONHUB_GA_DATABASE_USERNAME:postgres}
    password: ${IDEONHUB_GA_DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${IDEONHUB_GA_DATABASE_SEED:update}
    open-in-view: false

  jackson:
    property-naming-strategy: UPPER_CAMEL_CASE

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

weplm:
  ga:
    jwt:
      secret: ${IDEONHUB_GA_JWT_SECRET:}
      expiration-ms: ${IDEONHUB_GA_JWT_EXPIRATION_MS:3600000}
    security:
      cors:
        allowed-origins: ${IDEONHUB_GA_CORS_ALLOWED_ORIGINS:http://localhost:3000}
